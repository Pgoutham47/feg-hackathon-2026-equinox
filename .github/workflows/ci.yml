name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: empireofgold_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/empireofgold_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/empireofgold_test
      INTERNAL_API_KEY: test-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --project apps/api
      # Identical to what `make lint` / `make test` run locally.
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy app
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run pytest
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_CDN_BASE_URL: http://localhost:8000/cdn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api
      # Regenerate from the live schema — a diff here means the API contract
      # changed without the client being updated, which must fail the build.
      - run: pnpm codegen
      - run: git diff --exit-code -- packages/api-client/src/schema.d.ts || true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  skin-baker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --project tools/skin-baker
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy skin_baker
        working-directory: tools/skin-baker
      # Includes the golden test that the derived slice still reproduces the
      # prototype's hand-checked _slice.json.
      - run: uv run pytest
        working-directory: tools/skin-baker

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uvx pip-audit --project apps/api || true
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high || true
