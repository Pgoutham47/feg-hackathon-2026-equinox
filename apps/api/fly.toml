# Fly.io — the managed backend target. Swap for render.yaml or a Railway service
# without touching application code; the app reads everything from env.
app = "eog-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_FORMAT = "json"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/v1/readyz"
  timeout = "3s"

# Migrations run once per deploy, before the new machines take traffic.
[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
