# Local-only. Production Postgres is Supabase; nothing here deploys.
name: empireofgold-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: empireofgold
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empireofgold"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
