<script>
(function(){
  const T = {firstPaint:null, splashReady:null, visualsReady:null, assetsDone:null, bytes:null};
  const orig = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function(t,a){
    if(String(t).indexOf('webgl')===0) a = Object.assign({},a||{},{preserveDrawingBuffer:true});
    return orig.call(this,t,a);
  };
  function nonBlank(){
    const c=document.querySelector('canvas'); if(!c) return false;
    const gl=orig.call(c,'webgl2')||orig.call(c,'webgl'); if(!gl) return false;
    const px=new Uint8Array(4); let nb=0;
    for(let i=0;i<8;i++){
      gl.readPixels(Math.floor(c.width*(i+0.5)/8), Math.floor(c.height*(((i*3)%8)+0.5)/8),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
      if(px[0]+px[1]+px[2]>40) nb++;
    }
    return nb>=3;
  }
  function send(){ parent.postMessage({eog:true, ...T}, '*'); }
  (function tick(){
    if(!T.firstPaint && nonBlank()){ T.firstPaint=Math.round(performance.now()); send(); }
    requestAnimationFrame(tick);
  })();
  // splash-critical set: once these are down, the game can show its Play screen
  const SPLASH = ['splashBG.jpg','splashAssets.webp','EOG_Logo_Anim.png','controlPanelPrimaryAssets.webp','brandLogo.png'];
  // every visual the reels need — when these are down, the game is visually complete
  const VISUALS = ['symbols.webp','gameElements.webp','bigwins.png','bigwins_2.png',
                   'cup.png','low_5.png','scatter.png','chest.png','shield.png'];
  let last=0, lastN=0;
  setInterval(()=>{
    const r=performance.getEntriesByType('resource');
    if(r.length!==lastN){ lastN=r.length; last=performance.now(); }
    if(!T.splashReady){
      const hit = SPLASH.filter(n => r.some(x => x.name.includes(n)));
      if(hit.length === SPLASH.length){
        T.splashReady = Math.round(Math.max(...r.filter(x=>SPLASH.some(n=>x.name.includes(n))).map(x=>x.responseEnd)));
        send();
      }
    }
    if(!T.visualsReady){
      const have = VISUALS.filter(n => r.some(x => x.name.includes(n)));
      if(have.length === VISUALS.length){
        T.visualsReady = Math.round(Math.max(...r.filter(x=>VISUALS.some(n=>x.name.includes(n))).map(x=>x.responseEnd)));
        send();
      }
    }
    if(last && performance.now()-last>3500 && !T.assetsDone){
      T.assetsDone=Math.round(Math.max(...r.map(x=>x.responseEnd)));
      T.bytes=r.reduce((a,x)=>a+(x.transferSize||0),0);
      T.count=r.length;
      T.overWire=r.filter(x=>(x.transferSize||0)>1000).length;
      T.slowest=r.map(x=>({u:x.name.split('/').pop().split('?')[0], d:Math.round(x.duration),
                           end:Math.round(x.responseEnd), kb:Math.round((x.transferSize||0)/1024),
                           sw:!!x.workerStart}))
                 .sort((a,b)=>b.d-a.d).slice(0,12);
      T.viaWorker=r.filter(x=>x.workerStart>0).length;
      // full ordered load timeline — what the loader asked for, and when
      T.timeline=r.map(x=>({u:x.name.replace(location.origin,'').split('?')[0],
                            kb:Math.round((x.transferSize||0)/1024),
                            st:Math.round(x.startTime), end:Math.round(x.responseEnd),
                            sw:!!x.workerStart}))
                  .sort((a,b)=>a.st-b.st);
      send();
      try { fetch(location.origin + '/report', {method:'POST', body: JSON.stringify({at:new Date().toISOString(), origin:location.origin, ...T})}); } catch(e){}
    }
  },100);
})();
</script>
