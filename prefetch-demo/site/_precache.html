<!doctype html><meta charset="utf-8"><title>precache</title>
<body style="background:#111;color:#8f8;font:12px/1.6 monospace;padding:10px">
<div id="s">registering service worker…</div>
<script>
const mode = new URLSearchParams(location.search).get('mode') || 'all';
const s = document.getElementById('s');
const say = (t,bad) => { s.textContent = t; s.style.color = bad ? '#f88' : (mode==='slice'?'#8cf':'#8f8'); };
navigator.serviceWorker?.addEventListener('message', e => {
  const d = e.data;
  if (d.type === 'progress' || d.type === 'precached') {
    say(d.done + ' / ' + d.total + ' files — ' + (d.bytes/1048576).toFixed(1) + ' MB stored');
    parent.postMessage({precache:true, mode, ...d}, '*');
  }
});
(async () => {
  try {
    if (!navigator.serviceWorker) throw new Error('no service worker support');
    await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) { location.reload(); return; }
    const sw = navigator.serviceWorker.controller;
    say('clearing previous cache…');
    sw.postMessage({type:'clear'});
    await new Promise(r => setTimeout(r, 600));
    sw.postMessage({type:'setDefer', on: mode === 'sliceDefer'});
    await new Promise(r => setTimeout(r, 200));
    const urls = await (await fetch(mode === 'all' ? '_assets.json' : '_slice.json')).json();
    say('downloading ' + urls.length + ' files (' + mode + ')…');
    sw.postMessage({type:'precache', urls});
  } catch (err) {
    say('SERVICE WORKER FAILED: ' + err.message, true);
    parent.postMessage({precacheError: err.message}, '*');
  }
})();
</script>
