<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Empire of Gold — instant lobby</title>
<style>
  :root { color-scheme: dark; --bg:#141419; --card:#22222b; --line:#33333f; --dim:#8b8b99;
          --gold:#e8b53a; --ok:#3ddc84; --warn:#e8b53a; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#eee;
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:14px; }
  h1 { font-size:16px; margin:0; letter-spacing:-.2px; }
  main { padding:18px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px;
           padding:16px; max-width:760px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  button { background:var(--gold); color:#1a1a1a; border:0; border-radius:7px;
           padding:9px 14px; font-weight:600; font-size:13px; cursor:pointer; }
  button.ghost { background:transparent; color:#ddd; border:1px solid var(--line); }
  code { background:#1a1a22; padding:1px 5px; border-radius:4px; font-size:12px; }
  table { border-collapse:collapse; margin-top:12px; font-size:13px; }
  td { padding:3px 16px 3px 0; }
  td:first-child { color:var(--dim); }
  #log { margin-top:14px; font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
         color:var(--dim); white-space:pre-wrap; max-height:220px; overflow:auto; }
</style>
</head>
<body>
<header>
  <h1>Empire of Gold</h1>
  <span style="color:var(--dim);font-size:12px">phase 1 — slices + service worker</span>
</header>

<main>
  <div class="panel">
    <strong>Cache engine</strong>
    <table>
      <tr><td>worker</td><td id="s-sw">…</td></tr>
      <tr><td>slices</td><td id="s-slices">…</td></tr>
      <tr><td>cached</td><td id="s-cache">…</td></tr>
      <tr><td>toPlay resident</td><td id="s-play">…</td></tr>
    </table>
    <div class="row">
      <button id="b-play">Prefetch toPlay</button>
      <button id="b-after" class="ghost">Prefetch afterPlay</button>
      <button id="b-open" class="ghost">Open bundle</button>
      <button id="b-clear" class="ghost">Clear cache</button>
    </div>
    <div id="log"></div>
  </div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const mb = (n) => (n / 1048576).toFixed(2) + ' MB';
const log = (m) => { $('log').textContent = m + '\n' + $('log').textContent; };

let slices = null;
let worker = null;

/** Resolve the live worker at call time: `controller` appears once it claims us. */
const post = (msg) => (navigator.serviceWorker.controller || worker)?.postMessage(msg);

navigator.serviceWorker.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'sw:status' || d.type === 'sw:idle') {
    $('s-cache').textContent = `${d.entries} files · ${mb(d.bytes)}`;
    refreshResident();
  } else if (d.type === 'sw:progress') {
    log(`  ${d.kind} ${d.done}/${d.total} · ${mb(d.bytes)} new`);
  } else if (d.type === 'sw:ready') {
    log(`✓ ${d.kind} done — ${d.total} files, ${mb(d.bytes)} downloaded, complete=${d.complete}`);
    post({ type: 'sw:status' });
  } else if (d.type === 'sw:have') {
    $('s-play').textContent = d.complete
      ? `yes — all ${d.total} files`
      : `no — ${d.missing} of ${d.total} missing`;
  } else if (d.type === 'sw:cleared') {
    log('cache cleared');
    post({ type: 'sw:status' });
  }
});

const refreshResident = () => {
  if (slices) post({ type: 'sw:have', key: 'toPlay', files: slices.toPlay });
};

async function boot() {
  slices = await (await fetch('slices.json')).json();
  $('s-slices').textContent =
    `toSplash ${slices.toSplash.length} (${mb(slices.bytes.toSplash)}) · ` +
    `toPlay ${slices.toPlay.length} (${mb(slices.bytes.toPlay)}) · ` +
    `afterPlay ${slices.afterPlay.length} (${mb(slices.bytes.afterPlay)})`;

  try {
    const reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    // The worker calls skipWaiting + claim, so on a first visit `controller`
    // arrives a tick later. Wait for it rather than reloading the page: a reload
    // here throws away the tap the player already made.
    if (!navigator.serviceWorker.controller) {
      await new Promise((resolve) => {
        navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        setTimeout(resolve, 3000);
      });
    }
    worker = navigator.serviceWorker.controller || reg.active;
    $('s-sw').textContent = navigator.serviceWorker.controller
      ? 'active · scope ' + reg.scope
      : 'registered but not controlling';
    post({ type: 'sw:status' });
  } catch (err) {
    $('s-sw').textContent = 'unavailable — ' + err.message + ' (needs localhost or HTTPS)';
  }
}

$('b-play').onclick = () => {
  log('prefetching toPlay…');
  post({ type: 'sw:prefetch', kind: 'play', key: 'toPlay', files: slices.toPlay });
};
$('b-after').onclick = () => {
  log('prefetching afterPlay…');
  post({ type: 'sw:prefetch', kind: 'after', key: 'afterPlay', files: slices.afterPlay });
};
$('b-open').onclick = () => { location.href = 'bundle/index.html'; };
$('b-clear').onclick = () => post({ type: 'sw:clear' });

// Exposed for the Playwright harness in tools/.
window.__eog = {
  slices: () => slices,
  post,
  ready: () => navigator.serviceWorker.ready.then(() => !!navigator.serviceWorker.controller),
};

boot();
</script>
</body>
</html>
