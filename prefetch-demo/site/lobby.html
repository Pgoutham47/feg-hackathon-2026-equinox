<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lobby — prefetch demo</title>
<script src="/policy.js"></script>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{background:#0b0b0d;color:#e9e9ec;font:15px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:14px 14px 40px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:17px;margin:0;flex:1}
  .sw{display:flex;align-items:center;gap:8px;background:#17171b;border:1px solid #2a2a31;border-radius:20px;padding:6px 12px;cursor:pointer;user-select:none}
  .dot{width:9px;height:9px;border-radius:50%;background:#4ade80}
  .dot.off{background:#6b6b73}
  .sub{color:#83838c;font-size:12px;margin-bottom:12px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#83838c;margin-bottom:12px}
  .stats b{color:#e9e9ec;font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tile{border:1px solid #2a2a31;border-radius:12px;overflow:hidden;background:#141418;cursor:pointer;
        -webkit-tap-highlight-color:transparent;transition:transform .12s,border-color .12s}
  .tile:active{transform:scale(.97)}
  .tile.ready{border-color:#2f6b45}
  .art{height:96px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
       text-align:center;padding:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .meta{padding:8px 10px}
  .name{font-size:13px;font-weight:600;margin-bottom:2px}
  .badge{font-size:10.5px;color:#83838c;font-variant-numeric:tabular-nums}
  .badge.ready{color:#4ade80} .badge.busy{color:#fbbf24} .badge.tag{color:#60a5fa}
  #log{margin-top:16px;border-top:1px solid #23232a;padding-top:10px;font-size:12px;color:#83838c}
  #log b{color:#e9e9ec}
  .row{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
  .fast{color:#4ade80} .slow{color:#ff6b6b}
  #overlay{position:fixed;inset:0;background:#000d;display:none;z-index:9;padding:10px;flex-direction:column}
  #overlay.on{display:flex}
  #obar{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:#e9e9ec;font-size:13px}
  #otime{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  #frame{flex:1;width:100%;border:1px solid #2a2a31;border-radius:10px;background:#000}
  button{background:#26262e;color:#e9e9ec;border:1px solid #3a3a44;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
</style>

<header>
  <h1>Game Lobby</h1>
  <div class="sw" id="toggle"><span class="dot" id="dot"></span><span id="tlabel">Smart prefetch ON</span></div>
</header>
<div class="sub">Every tile runs the same certified bundle under a different URL, standing in for a catalogue. Throttled to a shared 25 Mbps.</div>
<div class="stats">
  <span>storage used <b id="stStore">0 MB</b></span>
  <span>prefetched <b id="stFiles">0</b> files</span>
  <span>wasted <b id="stWaste">0 MB</b></span>
  <span>hit rate <b id="stHit">—</b></span>
</div>

<div class="grid" id="grid"></div>

<div id="log"><b>Launches</b><div id="rows"></div></div>

<div id="overlay">
  <div id="obar">
    <button id="close">← Lobby</button>
    <span id="oname"></span>
    <span id="otime">…</span>
    <span id="onote" style="color:#83838c;font-size:12px"></span>
  </div>
  <iframe id="frame"></iframe>
</div>

<script>
const CACHE = 'eog-v1';
let GAMES = [];   // first 6 of games.json, so names match the skins the server serves
const $ = id => document.getElementById(id);
let prefetchOn = true, sliceList = null;
const SLICE_MB = 6.5, BUDGET_MB = 20;          // room for 3 games
const HKEY = 'eog-history';
const loadHistory = () => { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch(e){ return []; } };
const saveHistory = h => { try { localStorage.setItem(HKEY, JSON.stringify(h.slice(-200))); } catch(e){} };
let history = loadHistory();
let ranked = [];
const state = {};            // id -> {status, bytes}
const seenLaunch = [];
let prefetchedIds = new Set(), launchedIds = new Set();

const resetState = () => GAMES.forEach(g => state[g.id] = {status:'cold', bytes:0});

// ---------- rendering ----------
function render(){
  $('grid').innerHTML = '';
  const plan = planIds();
  GAMES.forEach(g => {
    const s = state[g.id];
    const el = document.createElement('div');
    el.className = 'tile' + (s.status==='ready' ? ' ready' : '');
    el.dataset.id = g.id;
    el.innerHTML = `<div class="art" style="background:${g.art}">${g.name}</div>
      <div class="meta"><div class="name">${g.name}</div>
      <div class="badge ${s.status==='ready'?'ready':s.status==='loading'?'busy':g.played?'tag':''}">${
        s.status==='ready' ? 'ready · ' + (s.bytes/1048576).toFixed(1) + ' MB'
        : s.status==='loading' ? 'prefetching…'
        : plan.includes(g.id) ? 'queued · ' + reasonFor(g.id)
        : reasonFor(g.id)}</div></div>`;
    $('grid').appendChild(el);
  });
  stats();
  if (typeof observeAll === 'function') observeAll();
}
function stats(){
  const files = Object.values(state).reduce((a,s)=>a+(s.files||0),0);
  const bytes = Object.values(state).reduce((a,s)=>a+s.bytes,0);
  $('stStore').textContent = (bytes/1048576).toFixed(1) + ' MB';
  $('stFiles').textContent = files;
  const wasted = [...prefetchedIds].filter(id => !launchedIds.has(id))
                  .reduce((a,id)=>a+(state[id].bytes||0),0);
  $('stWaste').textContent = (wasted/1048576).toFixed(1) + ' MB';
  const used = [...prefetchedIds].filter(id => launchedIds.has(id)).length;
  $('stHit').textContent = prefetchedIds.size ? Math.round(used/prefetchedIds.size*100) + '%' : '—';
}

// ---------- who do we prefetch, and why ----------
function refreshRanking(){ ranked = POLICY.rank(GAMES, history, Date.now()); }
function heldIds(){ return Object.keys(state).filter(id => state[id].status === 'ready').map(Number); }
function planIds(){ return POLICY.pick(ranked, BUDGET_MB, SLICE_MB, heldIds()).map(r => r.id); }
function reasonFor(id){
  const r = ranked.find(x => x.id === id);
  return r ? POLICY.reason(r, Date.now()) : 'not cached';
}
function recordPlay(id){
  history.push({id, t: Date.now()});
  saveHistory(history);
  refreshRanking();
}

// ---------- prefetching ----------
async function slices(){
  if (!sliceList) sliceList = await (await fetch('/_slice.json')).json();
  return sliceList;
}
async function prefetch(id, why){
  if (!prefetchOn || state[id].status !== 'cold') return;
  state[id].status = 'loading'; render();
  const urls = (await slices()).map(u => `/g${id}/${u}`);
  const cache = await caches.open(CACHE);
  let bytes = 0, i = 0;
  await Promise.all(Array.from({length:4}, async () => {
    while (i < urls.length) {
      const u = urls[i++];
      try {
        const res = await fetch(u, {cache:'reload'});
        if (res.ok) { bytes += (await res.clone().blob()).size; await cache.put(u, res); }
      } catch(e) {}
    }
  }));
  // count what's actually in the locker, not what the download loop thought it fetched
  const keys = await cache.keys();
  const mine = keys.filter(k => new URL(k.url).pathname.startsWith(`/g${id}/`));
  let stored = 0;
  for (const k of mine) { const r = await cache.match(k); if (r) stored += (await r.blob()).size; }
  state[id] = {status:'ready', bytes: stored, files: mine.length};
  prefetchedIds.add(id);
  console.log('prefetched', id, why);
  render();
}

// trigger 1: whatever the policy ranks highest, as soon as the lobby opens
async function prefetchHistory(){
  refreshRanking();
  const plan = planIds();
  render();
  for (const id of plan) await prefetch(id, 'policy');
}
// trigger 2: tile sits on screen for 400ms
const dwell = new Map();
let io = null;
function observeAll(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    const id = +e.target.dataset.id;
    if (e.isIntersecting) dwell.set(id, setTimeout(() => prefetch(id,'dwell'), 400));
    else { clearTimeout(dwell.get(id)); dwell.delete(id); }
  }), {threshold:.6});
  document.querySelectorAll('.tile').forEach(t => io.observe(t));
}
// trigger 3: finger down — before the tap even registers
$('grid').addEventListener('pointerdown', e => {
  const t = e.target.closest('.tile'); if (t) prefetch(+t.dataset.id, 'pointerdown');
}, {passive:true});

// ---------- launching ----------
let launchAt = 0, launching = null;
$('grid').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const id = +t.dataset.id, g = GAMES.find(x=>x.id===id);
  launching = {id, name:g.name, wasReady: state[id].status === 'ready'};
  launchedIds.add(id);
  recordPlay(id);
  $('oname').textContent = g.name;
  $('otime').textContent = '…';
  $('onote').textContent = launching.wasReady ? 'prefetched' : 'not prefetched';
  $('overlay').classList.add('on');
  launchAt = performance.now();
  $('frame').src = `/g${id}/_game.html?r=${Date.now()}`;
});
$('close').onclick = () => { $('overlay').classList.remove('on'); $('frame').src = 'about:blank'; stats(); };

addEventListener('message', e => {
  const d = e.data || {};
  if (!d.eog || !launching || !d.splashReady) return;
  const secs = d.splashReady/1000;
  $('otime').textContent = secs.toFixed(2) + ' s';
  $('otime').className = secs < 0.5 ? 'fast' : 'slow';
  if (!seenLaunch.includes(launching)) {
    seenLaunch.push(launching);
    const r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = `<span>${launching.name} · ${launching.wasReady?'prefetched':'cold'}</span>
                   <b class="${secs<0.5?'fast':'slow'}">${secs.toFixed(2)} s</b>`;
    $('rows').prepend(r);
    fetch('/report',{method:'POST',body:JSON.stringify({lobby:true, game:launching.name,
      prefetched:launching.wasReady, playScreen:d.splashReady})});
  }
  launching = null;
});

// ---------- toggle ----------
$('toggle').onclick = async () => {
  prefetchOn = !prefetchOn;
  $('dot').className = 'dot' + (prefetchOn ? '' : ' off');
  $('tlabel').textContent = 'Smart prefetch ' + (prefetchOn ? 'ON' : 'OFF');
  await caches.delete(CACHE);
  resetState();
  prefetchedIds = new Set(); launchedIds = new Set();
  render();
  if (prefetchOn) prefetchHistory();
};

// ---------- boot ----------
(async () => {
  GAMES = (await (await fetch('/games.json')).json()).slice(0, 6)
    .map(g => ({id: g.id, name: g.name, art: `linear-gradient(150deg,${g.grad})`}));
  resetState();
  try {
    await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) { location.reload(); return; }
  } catch (err) {
    document.querySelector('.sub').innerHTML =
      '<b style="color:#ff6b6b">Service worker unavailable (' + err.message +
      '). This page must be on localhost or HTTPS.</b>';
  }
  await caches.delete(CACHE);
  render(); observeAll(); prefetchHistory();
})();
</script>
