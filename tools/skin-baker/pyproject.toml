[project]
name = "eog-skin-baker"
version = "0.1.0"
description = "Bakes the per-game skin packs and publishes them to object storage"
requires-python = ">=3.12"
dependencies = [
  "pillow>=10.4.0",
  "numpy>=2.1.0",
  "typer>=0.12.5",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.6.8", "mypy>=1.11.0"]

[project.scripts]
skin-baker = "skin_baker.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skin_baker"]
